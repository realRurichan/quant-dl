[project]
name = "quant-dl"
version = "0.1.0"
description = "Deep learning for quantitative trading: price prediction + backtesting"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
